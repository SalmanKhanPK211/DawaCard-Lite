    <!-- Structured Data (JSON-LD): WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DawaCard Lite",
      "url": "https://dawa-card-lite.vercel.app/",
      "description": "Intelligent personal medication record, AI prescription scanner, drug-drug interaction checker, and emergency health card with QR access.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI Prescription OCR scanner powered by Google Gemini",
        "Clinical drug-drug and drug-allergy conflict checker",
        "Daily 4-box pill schedule organizer (Morning, Afternoon, Evening, Bedtime)",
        "Instant emergency QR code for first responders and EMTs without login",
        "Printable A4 medical summary and health card",
        "Bilingual English and Urdu interface"
      ]
    }
    </script>

    <!-- Structured Data (JSON-LD): Organization -->

    <!-- Structured Data (JSON-LD): FAQPage for Rich Search Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is DawaCard Lite?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DawaCard Lite is an AI-powered personal medication management and emergency health card web application. It organizes daily pill schedules, scans prescriptions using Google Gemini AI, monitors clinical drug-drug interactions, and provides an emergency QR code for first responders."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI prescription scanner work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Users upload a photograph of a physical paper prescription. Google Gemini AI extracts medication name, dosage form, strength, instructions, and schedule into candidate fields with side-by-side human verification before saving."
          }
        },
        {
          "@type": "Question",
          "name": "How do paramedics access the emergency health card?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Paramedics and first responders scan the patient's DawaCard emergency QR code with any standard smartphone camera. No login or password is required, giving instant visibility to blood type, critical allergies, active medications, and emergency contacts."
          }
        },
        {
          "@type": "Question",
          "name": "Does DawaCard Lite support Urdu?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, DawaCard Lite provides a complete English and Urdu (اردو) language toggle across the entire application and official user manual."
          }
        }
      ]
    }
    </script>
